  <text x="60" y="112" font-family="'Noto Sans', 'Segoe UI', Arial, sans-serif" font-size="5" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GOVT. OF INDIA</text>
